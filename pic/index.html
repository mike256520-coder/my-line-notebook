<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE pic記事本</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            =PIC記事本= #其他#文章#DJ。#金融#股市。#音樂 #吉他#和弦#音階 #歌曲#吉他譜#演奏#JAZZ。#醫健#心理 #旅遊#登山。#居家#生活 #水電#繩結 #購物
            。#PC。#歷史#宗教 #搜奇#宇宙#物理。#英文 ** &lt;a href=""&gt;&lt;/a&gt;
            <div class="search-area">
                <input type="text" id="search-input" placeholder="截圖版/標籤...">
                <button id="search-btn">搜尋</button>
            </div>
            <div id="active-filter" class="hidden">
                正在查看標籤: <span id="current-tag"></span>
                <button onclick="clearFilter()">清除搜尋</button>
            </div>
        </header>

        <section class="post-box">
            <textarea id="post-input" placeholder="#標籤...YT截圖版(FB不適用)&#10;可拖圖"></textarea>

            <!-- 圖片預覽區 -->
            <div id="image-preview-container"></div>

            <div class="post-actions">
                <input type="file" id="image-input" accept="image/*" multiple style="display:none">
                <button id="image-btn" title="上傳圖片">🖼 圖片</button>
                <button id="submit-btn">送出(稍待截圖)</button>
            </div>
        </section>

        <main id="post-list">
            <div class="loading">載入中...</div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
