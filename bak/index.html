<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>line-notebook記事本 — 備份工具</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 32px 16px 64px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            padding: 32px 28px;
            width: 100%;
            max-width: 520px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: #52d05a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .logo-text h1 {
            font-size: 17px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.2;
        }

        .logo-text p {
            font-size: 13px;
            color: #888;
            margin-top: 2px;
        }

        .section-label {
            font-size: 12px;
            font-weight: 600;
            color: #888;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
        }

        .field input[type="date"] {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            color: #1a1a1a;
            background: #fafafa;
            outline: none;
            transition: border-color 0.15s;
            appearance: none;
            -webkit-appearance: none;
        }

        .field input[type="date"]:focus {
            border-color: #52d05a;
            background: #fff;
        }

        .quick-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .quick-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1.5px solid #ddd;
            background: #fff;
            color: #444;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .quick-btn:hover {
            border-color: #52d05a;
            color: #2a8a30;
            background: #f0faf0;
        }

        .divider {
            border: none;
            border-top: 1px solid #eee;
            margin: 20px 0;
        }

        .format-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .format-option {
            position: relative;
        }

        .format-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
        }

        .format-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 8px;
            border: 1.5px solid #ddd;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            color: #555;
            background: #fafafa;
            transition: all 0.15s;
            text-align: center;
        }

        .format-option label .fmt-icon {
            font-size: 24px;
        }

        .format-option input[type="radio"]:checked + label {
            border-color: #52d05a;
            background: #f0faf0;
            color: #2a8a30;
            font-weight: 600;
        }

        .format-option label:hover {
            border-color: #52d05a;
            background: #f8fdf8;
        }

        .options-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-row span {
            font-size: 14px;
            color: #444;
        }

        .toggle {
            position: relative;
            width: 42px;
            height: 24px;
        }

        .toggle input { display: none; }

        .toggle-slider {
            position: absolute;
            inset: 0;
            background: #ddd;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            left: 3px;
            top: 3px;
            transition: transform 0.2s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        .toggle input:checked + .toggle-slider {
            background: #52d05a;
        }

        .toggle input:checked + .toggle-slider::before {
            transform: translateX(18px);
        }

        .backup-btn {
            width: 100%;
            padding: 14px;
            background: #52d05a;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .backup-btn:hover { background: #3db544; }
        .backup-btn:active { transform: scale(0.98); }
        .backup-btn:disabled { background: #aaa; cursor: not-allowed; }

        /* Status / log */
        #status-box {
            display: none;
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 10px;
            background: #f5f5f5;
            font-size: 13px;
            color: #444;
            line-height: 1.7;
        }

        #status-box.success { background: #edfaf0; color: #1f7a2b; }
        #status-box.error   { background: #fdeaea; color: #a32020; }
        #status-box.running { background: #edf5ff; color: #1a4a9b; }

        .progress-bar {
            height: 4px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: #52d05a;
            border-radius: 4px;
            transition: width 0.3s;
            width: 0%;
        }

        .stat-row {
            display: flex;
            gap: 16px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .stat {
            flex: 1;
            min-width: 100px;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 10px;
            padding: 10px 12px;
            text-align: center;
        }

        .stat .num { font-size: 22px; font-weight: 700; color: #1a1a1a; }
        .stat .lbl { font-size: 11px; color: #999; margin-top: 2px; }

        .download-btn {
            display: none;
            margin-top: 14px;
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .download-btn:hover { background: #333; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">
        <div class="logo-icon">📋</div>
        <div class="logo-text">
            <h1>line-notebook記事本 備份工具</h1>
            <p>依日期範圍匯出 Firestore 資料</p>
        </div>
    </div>

    <div class="section-label">日期範圍</div>
    <div class="date-row">
        <div class="field">
            <label for="date-from">起始日期</label>
            <input type="date" id="date-from">
        </div>
        <div class="field">
            <label for="date-to">結束日期</label>
            <input type="date" id="date-to">
        </div>
    </div>

    <div class="quick-btns">
        <button class="quick-btn" onclick="setRange(7)">最近 7 天</button>
        <button class="quick-btn" onclick="setRange(30)">最近 30 天</button>
        <button class="quick-btn" onclick="setRange(90)">最近 3 個月</button>
        <button class="quick-btn" onclick="setRange(365)">最近 1 年</button>
        <button class="quick-btn" onclick="setAll()">全部資料</button>
    </div>

    <hr class="divider">

    <div class="section-label">匯出格式</div>
    <div class="format-row">
        <div class="format-option">
            <input type="radio" name="fmt" id="fmt-json" value="json" checked>
            <label for="fmt-json">
                <span class="fmt-icon">{ }</span>
                JSON
            </label>
        </div>
        <div class="format-option">
            <input type="radio" name="fmt" id="fmt-csv" value="csv">
            <label for="fmt-csv">
                <span class="fmt-icon">📊</span>
                CSV
            </label>
        </div>
        <div class="format-option">
            <input type="radio" name="fmt" id="fmt-txt" value="txt">
            <label for="fmt-txt">
                <span class="fmt-icon">📄</span>
                TXT
            </label>
        </div>
    </div>

    <div class="section-label">選項</div>
    <div class="options-row">
        <div class="toggle-row">
            <span>包含圖片（Base64）</span>
            <label class="toggle">
                <input type="checkbox" id="opt-images" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="toggle-row">
            <span>僅匯出含標籤的貼文</span>
            <label class="toggle">
                <input type="checkbox" id="opt-tagged">
                <span class="toggle-slider"></span>
            </label>
        </div>
    </div>

    <button class="backup-btn" id="backup-btn" onclick="startBackup()">🔄 開始備份</button>

    <div id="status-box"></div>
    <div class="progress-bar" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="stat-row" id="stat-row" style="display:none"></div>
    <button class="download-btn" id="download-btn">⬇ 下載備份檔案</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, orderBy, getDocs, Timestamp }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyACO9osKdxj8x2-fAwxgUM0YA_zM2uCWwU",
    authDomain: "line-note-9be19.firebaseapp.com",
    projectId: "line-note-9be19",
    storageBucket: "line-note-9be19.firebasestorage.app",
    messagingSenderId: "186753935423",
    appId: "1:186753935423:web:62a5d9cdf6a66eb8a2f08a"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── 快速日期設定 ──────────────────────────
window.setRange = (days) => {
    const to   = new Date();
    const from = new Date(Date.now() - days * 86400000);
    document.getElementById('date-to').value   = toDateInput(to);
    document.getElementById('date-from').value = toDateInput(from);
};

window.setAll = () => {
    document.getElementById('date-from').value = '';
    document.getElementById('date-to').value   = '';
};

function toDateInput(d) {
    return d.toISOString().split('T')[0];
}

// ── 預設：最近 30 天 ──────────────────────
setRange(30);

// ── 主備份邏輯 ────────────────────────────
window.startBackup = async () => {
    const btn     = document.getElementById('backup-btn');
    const box     = document.getElementById('status-box');
    const dlBtn   = document.getElementById('download-btn');
    const statRow = document.getElementById('stat-row');
    const bar     = document.getElementById('progress-bar');
    const fill    = document.getElementById('progress-fill');

    const fromVal = document.getElementById('date-from').value;
    const toVal   = document.getElementById('date-to').value;
    const fmt     = document.querySelector('input[name="fmt"]:checked').value;
    const withImg = document.getElementById('opt-images').checked;
    const tagOnly = document.getElementById('opt-tagged').checked;

    btn.disabled = true;
    dlBtn.style.display = 'none';
    statRow.style.display = 'none';
    bar.style.display = 'block';
    fill.style.width  = '10%';
    box.style.display = 'block';
    box.className = 'running';
    box.textContent = '正在連線到 Firestore…';

    try {
        const constraints = [orderBy("createdAt", "desc")];

        if (fromVal) {
            const from = new Date(fromVal + 'T00:00:00');
            constraints.push(where("createdAt", ">=", Timestamp.fromDate(from)));
        }
        if (toVal) {
            const to = new Date(toVal + 'T23:59:59');
            constraints.push(where("createdAt", "<=", Timestamp.fromDate(to)));
        }

        const q  = query(collection(db, "posts"), ...constraints);
        fill.style.width = '40%';
        box.textContent  = '讀取資料中…';

        const snapshot = await getDocs(q);
        fill.style.width = '75%';

        let docs = snapshot.docs.map(d => {
            const data = d.data();
            return {
                id:          d.id,
                content:     data.content || '',
                tags:        data.tags || [],
                imageBase64s: withImg ? (data.imageBase64s || []) : (data.imageBase64s?.length ? [`(${data.imageBase64s.length} 張圖片已省略)`] : []),
                createdAt:   data.createdAt?.toDate().toLocaleString('zh-TW') || ''
            };
        });

        if (tagOnly) docs = docs.filter(d => d.tags.length > 0);

        fill.style.width = '90%';
        box.textContent  = '產生檔案中…';

        const totalImages = docs.reduce((sum, d) => {
            if (!withImg) return sum;
            const orig = snapshot.docs.find(s => s.id === d.id)?.data();
            return sum + (orig?.imageBase64s?.length || 0);
        }, 0);

        let blob, filename;
        const dateTag = fromVal || toVal
            ? `${fromVal || 'all'}_to_${toVal || 'all'}`
            : 'all';

        if (fmt === 'json') {
            blob     = new Blob([JSON.stringify(docs, null, 2)], { type: 'application/json' });
            filename = `line-notebook-backup_${dateTag}.json`;
        } else if (fmt === 'csv') {
            const header = ['id', 'createdAt', 'tags', 'content', withImg ? 'imageCount' : ''].filter(Boolean);
            const rows   = docs.map(d => [
                d.id,
                d.createdAt,
                d.tags.join('|'),
                `"${(d.content || '').replace(/"/g,'""')}"`,
                ...(withImg ? [d.imageBase64s.length] : [])
            ]);
            const csv = [header.join(','), ...rows.map(r => r.join(','))].join('\n');
            blob     = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
            filename = `backup_${dateTag}.csv`;
        } else {
            const lines = docs.map(d =>
`━━━━━━━━━━━━━━━━━━━━━━
🕐 ${d.createdAt}
🏷  ${d.tags.map(t => '#'+t).join(' ') || '（無標籤）'}

${d.content}
${d.imageBase64s.length ? `\n📷 圖片：${d.imageBase64s.length} 張` : ''}`
            );
            blob     = new Blob([lines.join('\n\n')], { type: 'text/plain;charset=utf-8' });
            filename = `backup_${dateTag}.txt`;
        }

        const url = URL.createObjectURL(blob);
        dlBtn.style.display = 'block';
        dlBtn.onclick = () => {
            const a = document.createElement('a');
            a.href     = url;
            a.download = filename;
            a.click();
        };
        dlBtn.textContent = `⬇ 下載 ${filename}`;

        fill.style.width = '100%';
        box.className    = 'success';
        box.textContent  = `✅ 備份完成！共 ${docs.length} 篇貼文`;

        statRow.style.display = 'flex';
        statRow.innerHTML = `
            <div class="stat"><div class="num">${docs.length}</div><div class="lbl">貼文數量</div></div>
            <div class="stat"><div class="num">${docs.reduce((s,d)=>s+d.tags.length,0)}</div><div class="lbl">標籤總數</div></div>
            <div class="stat"><div class="num">${(blob.size/1024).toFixed(1)} KB</div><div class="lbl">檔案大小</div></div>
        `;

        if (docs.length === 0) {
            box.textContent = '⚠️ 該日期範圍內沒有資料';
            box.className   = '';
        }

    } catch (e) {
        fill.style.width  = '100%';
        box.className     = 'error';
        box.textContent   = '❌ 備份失敗：' + e.message;
        console.error(e);
    } finally {
        btn.disabled = false;
    }
};
</script>
</body>
</html>
