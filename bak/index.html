<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圖片 ↔ Base64 轉換器</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #151820;
    --panel: #1c2030;
    --border: #2a3045;
    --accent: #4af0b0;
    --accent2: #6c8fff;
    --warn: #ff7b54;
    --text: #e8eaf0;
    --muted: #6b7694;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Noto Sans TC', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 52px;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }

  .logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  h1 {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-top: 6px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 28px;
    width: fit-content;
  }

  .tab {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 9px 22px;
    border-radius: 8px;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .tab.active {
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 0 0 1px var(--border);
  }

  .tab:hover:not(.active) { color: var(--text); }

  /* Panels */
  .panel { display: none; animation: fadeIn 0.25s ease; }
  .panel.active { display: block; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Drop zone */
  .drop-zone {
    border: 1.5px dashed var(--border);
    border-radius: 16px;
    background: var(--surface);
    padding: 56px 32px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
  }

  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(74,240,176,0.04);
  }

  .drop-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .drop-icon { font-size: 40px; margin-bottom: 12px; }

  .drop-title {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }

  .drop-sub { font-size: 12px; color: var(--muted); }

  /* Image preview */
  .img-preview-box {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  .img-preview-box.show { display: block; animation: fadeIn 0.3s ease; }

  .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }

  .preview-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .preview-meta span { color: var(--accent); }

  .img-frame {
    background: repeating-conic-gradient(#1e2335 0% 25%, #161a28 0% 50%) 0 0 / 20px 20px;
    display: flex; align-items: center; justify-content: center;
    max-height: 280px;
    overflow: hidden;
    padding: 20px;
  }

  .img-frame img {
    max-width: 100%;
    max-height: 240px;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  /* Output area */
  .output-section {
    margin-top: 20px;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .options-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .opt-btn {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.06em;
  }

  .opt-btn:hover, .opt-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  textarea {
    width: 100%;
    height: 160px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.7;
    padding: 16px;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: var(--accent2); }

  .action-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 11px 24px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-primary {
    background: var(--accent);
    color: #0d1a14;
  }

  .btn-primary:hover { background: #6fffc8; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { border-color: var(--accent2); color: var(--accent2); }

  .btn-warn {
    background: transparent;
    color: var(--warn);
    border: 1px solid var(--warn);
  }

  .btn-warn:hover { background: rgba(255,123,84,0.1); }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 20px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .stat-value {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--panel);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 12px 24px;
    border-radius: 8px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
    white-space: nowrap;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: var(--warn); color: var(--warn); }

  /* Progress */
  .progress {
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    margin-top: 12px;
    overflow: hidden;
    display: none;
  }

  .progress.show { display: block; }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    transition: width 0.3s ease;
    border-radius: 1px;
  }

  /* Read panel - decoded image */
  .decoded-frame {
    background: repeating-conic-gradient(#1e2335 0% 25%, #161a28 0% 50%) 0 0 / 20px 20px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    padding: 24px;
    margin-top: 14px;
  }

  .decoded-placeholder {
    text-align: center;
    color: var(--muted);
  }

  .decoded-placeholder .ph-icon { font-size: 36px; margin-bottom: 8px; }
  .decoded-placeholder p { font-size: 12px; font-family: var(--mono); }

  .decoded-frame img {
    max-width: 100%;
    max-height: 360px;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    display: none;
  }

  /* Format selector */
  .format-group {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .format-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  select {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 10px;
    outline: none;
    cursor: pointer;
  }

  select:focus { border-color: var(--accent2); }

  @media (max-width: 600px) {
    .wrap { padding: 28px 16px 60px; }
    .tab { padding: 8px 14px; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <div class="logo-icon">🔄</div>
    </div>
    <h1>Image ↔ Base64 Converter</h1>
    <p class="subtitle">圖片轉文字 &nbsp;/&nbsp; 文字讀圖片</p>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('encode')">📷 圖片 → 文字</button>
    <button class="tab" onclick="switchTab('decode')">📄 文字 → 圖片</button>
  </div>

  <!-- Encode Panel -->
  <div class="panel active" id="panel-encode">
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this.files[0])">
      <div class="drop-icon">🖼️</div>
      <div class="drop-title">拖曳圖片到這裡，或點擊選擇</div>
      <div class="drop-sub">支援 JPG、PNG、GIF、WEBP、SVG、BMP 等格式</div>
    </div>

    <div class="img-preview-box" id="imgPreviewBox">
      <div class="preview-header">
        <div class="preview-meta">檔案：<span id="metaName">—</span></div>
        <div class="preview-meta">大小：<span id="metaSize">—</span></div>
        <div class="preview-meta">尺寸：<span id="metaDim">—</span></div>
      </div>
      <div class="img-frame">
        <img id="previewImg" src="" alt="preview">
      </div>
    </div>

    <div class="output-section" id="outputSection" style="display:none">
      <div class="section-label">輸出設定</div>
      <div style="display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; align-items:center">
        <div class="format-group">
          <span class="format-label">格式</span>
          <select id="outputFormat">
            <option value="dataurl">完整 Data URL</option>
            <option value="base64only">純 Base64（不含前綴）</option>
            <option value="txt">存成 .txt 格式</option>
          </select>
        </div>
        <div class="format-group">
          <span class="format-label">品質（JPG）</span>
          <select id="quality">
            <option value="1">最高 100%</option>
            <option value="0.9">高 90%</option>
            <option value="0.75" selected>標準 75%</option>
            <option value="0.5">低 50%</option>
          </select>
        </div>
      </div>

      <div class="section-label">Base64 輸出</div>
      <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
      <textarea id="outputText" placeholder="Base64 字串將顯示在這裡..." readonly></textarea>

      <div class="stats-bar" id="statsBar" style="display:none">
        <div class="stat"><div class="stat-label">原始大小</div><div class="stat-value" id="statOrig">—</div></div>
        <div class="stat"><div class="stat-label">Base64 大小</div><div class="stat-value" id="statB64">—</div></div>
        <div class="stat"><div class="stat-label">膨脹率</div><div class="stat-value" id="statRatio">—</div></div>
        <div class="stat"><div class="stat-label">字元數</div><div class="stat-value" id="statChars">—</div></div>
      </div>

      <div class="action-row">
        <button class="btn btn-primary" id="btnGenerate" onclick="generateBase64()">⚡ 產生 Base64</button>
        <button class="btn btn-secondary" onclick="copyOutput()">📋 複製</button>
        <button class="btn btn-secondary" onclick="downloadTxt()">💾 下載 .txt</button>
        <button class="btn btn-warn" onclick="resetEncoder()">✕ 清除</button>
      </div>
    </div>
  </div>

  <!-- Decode Panel -->
  <div class="panel" id="panel-decode">
    <div class="section-label">貼入或上傳 Base64 文字</div>

    <div style="display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap">
      <label style="position:relative; overflow:hidden;">
        <button class="btn btn-secondary" onclick="this.parentElement.querySelector('input').click()" style="pointer-events:none">📂 載入 .txt 檔</button>
        <input type="file" accept=".txt,.b64,text/*" style="position:absolute;inset:0;opacity:0;cursor:pointer" onchange="loadTxtFile(this)">
      </label>
      <button class="btn btn-secondary" onclick="pasteTxtFromClipboard()">📋 從剪貼簿貼入</button>
      <button class="btn btn-secondary" onclick="clearDecoder()">✕ 清除</button>
    </div>

    <textarea id="decodeInput" placeholder="在這裡貼入 Base64 字串或 Data URL&#10;&#10;例如：&#10;data:image/png;base64,iVBORw0KGgo...&#10;或純 Base64：iVBORw0KGgo..." oninput="onDecodeInput()"></textarea>

    <div style="display:flex; gap:10px; margin-top:12px; align-items:center; flex-wrap:wrap">
      <button class="btn btn-primary" onclick="decodeBase64()">🔍 解碼顯示圖片</button>
      <div class="format-group" style="margin:0">
        <span class="format-label">另存格式</span>
        <select id="saveFormat">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
          <option value="webp">WEBP</option>
        </select>
      </div>
      <button class="btn btn-secondary" id="btnSaveImg" onclick="saveDecodedImage()" disabled>💾 下載圖片</button>
    </div>

    <div class="decoded-frame" id="decodedFrame">
      <div class="decoded-placeholder" id="decodePlaceholder">
        <div class="ph-icon">🔎</div>
        <p>貼入 Base64 後點擊「解碼顯示圖片」</p>
      </div>
      <img id="decodedImg" src="" alt="decoded image">
    </div>

    <div class="stats-bar" id="decodeStats" style="display:none">
      <div class="stat"><div class="stat-label">字串長度</div><div class="stat-value" id="dStatLen">—</div></div>
      <div class="stat"><div class="stat-label">估算大小</div><div class="stat-value" id="dStatSize">—</div></div>
      <div class="stat"><div class="stat-label">偵測類型</div><div class="stat-value" id="dStatType">—</div></div>
      <div class="stat"><div class="stat-label">尺寸</div><div class="stat-value" id="dStatDim">—</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let currentFile = null;
  let currentDataUrl = null;
  let decodedDataUrl = null;

  // ── Tab ─────────────────────────────────────────
  function switchTab(id) {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['encode','decode'][i] === id));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + id).classList.add('active');
  }

  // ── Drag & Drop ─────────────────────────────────
  const dz = document.getElementById('dropZone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) handleFile(f);
    else showToast('請拖入圖片檔案', true);
  });

  // ── Handle file ──────────────────────────────────
  function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) return showToast('不支援的檔案格式', true);
    currentFile = file;
    const reader = new FileReader();
    reader.onload = e => {
      const url = e.target.result;
      const img = document.getElementById('previewImg');
      img.src = url;
      img.onload = () => {
        document.getElementById('metaDim').textContent = img.naturalWidth + ' × ' + img.naturalHeight;
      };
      document.getElementById('metaName').textContent = file.name;
      document.getElementById('metaSize').textContent = formatBytes(file.size);
      document.getElementById('imgPreviewBox').classList.add('show');
      document.getElementById('outputSection').style.display = 'block';
      document.getElementById('outputText').value = '';
      document.getElementById('statsBar').style.display = 'none';
      currentDataUrl = url;
    };
    reader.readAsDataURL(file);
    dz.style.display = 'none';
  }

  // ── Generate Base64 ──────────────────────────────
  function generateBase64() {
    if (!currentFile) return showToast('請先選擇圖片', true);
    const format = document.getElementById('outputFormat').value;
    const quality = parseFloat(document.getElementById('quality').value);

    // Show progress
    const prog = document.getElementById('progress');
    const bar = document.getElementById('progressBar');
    prog.classList.add('show');
    bar.style.width = '30%';

    setTimeout(() => {
      bar.style.width = '70%';
      setTimeout(() => {
        let result = currentDataUrl;
        if (format === 'base64only') {
          result = result.split(',')[1];
        }
        bar.style.width = '100%';
        setTimeout(() => { prog.classList.remove('show'); bar.style.width = '0%'; }, 400);

        document.getElementById('outputText').value = result;

        // Stats
        const origSize = currentFile.size;
        const b64Size = result.length;
        const ratio = ((b64Size / origSize) * 100).toFixed(1);
        document.getElementById('statOrig').textContent = formatBytes(origSize);
        document.getElementById('statB64').textContent = formatBytes(b64Size);
        document.getElementById('statRatio').textContent = ratio + '%';
        document.getElementById('statChars').textContent = b64Size.toLocaleString();
        document.getElementById('statsBar').style.display = 'flex';

        showToast('✓ Base64 產生完成');
      }, 200);
    }, 100);
  }

  // ── Copy ─────────────────────────────────────────
  function copyOutput() {
    const txt = document.getElementById('outputText').value;
    if (!txt) return showToast('沒有內容可複製', true);
    navigator.clipboard.writeText(txt).then(() => showToast('✓ 已複製到剪貼簿')).catch(() => {
      document.getElementById('outputText').select();
      document.execCommand('copy');
      showToast('✓ 已複製');
    });
  }

  // ── Download txt ─────────────────────────────────
  function downloadTxt() {
    const txt = document.getElementById('outputText').value;
    if (!txt) { generateBase64(); setTimeout(downloadTxt, 500); return; }
    const baseName = (currentFile?.name || 'image').replace(/\.[^.]+$/, '');
    downloadText(txt, baseName + '_base64.txt');
    showToast('✓ 已下載 .txt 檔');
  }

  function downloadText(content, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], { type: 'text/plain' }));
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function resetEncoder() {
    currentFile = null; currentDataUrl = null;
    document.getElementById('fileInput').value = '';
    document.getElementById('imgPreviewBox').classList.remove('show');
    document.getElementById('outputSection').style.display = 'none';
    document.getElementById('outputText').value = '';
    document.getElementById('statsBar').style.display = 'none';
    dz.style.display = 'block';
  }

  // ── Decode Panel ─────────────────────────────────
  function onDecodeInput() {
    document.getElementById('btnSaveImg').disabled = true;
    document.getElementById('decodedImg').style.display = 'none';
    document.getElementById('decodePlaceholder').style.display = 'block';
    document.getElementById('decodeStats').style.display = 'none';
    decodedDataUrl = null;
  }

  function loadTxtFile(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('decodeInput').value = e.target.result.trim();
      showToast('✓ 已載入 ' + file.name);
    };
    reader.readAsText(file);
    input.value = '';
  }

  async function pasteTxtFromClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      document.getElementById('decodeInput').value = text.trim();
      showToast('✓ 已從剪貼簿貼入');
    } catch {
      showToast('無法存取剪貼簿，請手動貼上', true);
    }
  }

  function clearDecoder() {
    document.getElementById('decodeInput').value = '';
    document.getElementById('decodedImg').style.display = 'none';
    document.getElementById('decodePlaceholder').style.display = 'block';
    document.getElementById('decodeStats').style.display = 'none';
    document.getElementById('btnSaveImg').disabled = true;
    decodedDataUrl = null;
  }

  function decodeBase64() {
    let raw = document.getElementById('decodeInput').value.trim();
    if (!raw) return showToast('請先輸入 Base64 字串', true);

    // Auto-detect format
    let dataUrl = raw;
    let mimeType = 'image/png';

    if (!raw.startsWith('data:')) {
      // Pure base64 — try to detect type from first bytes
      try {
        const bytes = atob(raw.substring(0, 16));
        if (bytes.startsWith('\xFF\xD8')) mimeType = 'image/jpeg';
        else if (bytes.startsWith('\x89PNG')) mimeType = 'image/png';
        else if (bytes.startsWith('GIF')) mimeType = 'image/gif';
        else if (bytes.startsWith('RIFF')) mimeType = 'image/webp';
      } catch {}
      dataUrl = `data:${mimeType};base64,${raw}`;
    } else {
      mimeType = raw.match(/data:([^;]+)/)?.[1] || 'image/png';
    }

    const img = document.getElementById('decodedImg');
    img.onload = () => {
      document.getElementById('decodePlaceholder').style.display = 'none';
      img.style.display = 'block';
      document.getElementById('btnSaveImg').disabled = false;
      decodedDataUrl = dataUrl;

      // Stats
      const b64 = dataUrl.split(',')[1] || raw;
      const estBytes = Math.floor(b64.length * 3 / 4);
      document.getElementById('dStatLen').textContent = raw.length.toLocaleString();
      document.getElementById('dStatSize').textContent = formatBytes(estBytes);
      document.getElementById('dStatType').textContent = mimeType.replace('image/', '').toUpperCase();
      document.getElementById('dStatDim').textContent = img.naturalWidth + ' × ' + img.naturalHeight;
      document.getElementById('decodeStats').style.display = 'flex';

      showToast('✓ 圖片解碼成功');
    };
    img.onerror = () => showToast('解碼失敗：格式不正確或字串有誤', true);
    img.src = dataUrl;
  }

  function saveDecodedImage() {
    if (!decodedDataUrl) return;
    const fmt = document.getElementById('saveFormat').value;

    if (fmt === 'png' || decodedDataUrl.includes(`image/${fmt}`)) {
      const a = document.createElement('a');
      a.href = decodedDataUrl;
      a.download = `decoded_image.${fmt}`;
      a.click();
    } else {
      // Convert via canvas
      const img = document.getElementById('decodedImg');
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext('2d').drawImage(img, 0, 0);
      const a = document.createElement('a');
      a.href = canvas.toDataURL(`image/${fmt}`, 0.9);
      a.download = `decoded_image.${fmt}`;
      a.click();
    }
    showToast(`✓ 已下載 .${fmt} 圖片`);
  }

  // ── Helpers ──────────────────────────────────────
  function formatBytes(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(2) + ' MB';
  }

  let toastTimer;
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '') + ' show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }
</script>
</body>
